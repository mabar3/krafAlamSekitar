            <div class="sticker-chip blink-guide" style="width:72px; height:52px; flex-direction:column; font-size:20px;" data-item="${it.id}">
              <span>${it.emoji}</span>
              <span style="font-size:10px; font-weight:700;">${it.label}</span>
            </div>
          `).join('')}
        </div>
      `;
      const targetSvg = document.getElementById('org-items-target');
      document.querySelectorAll('[data-item]').forEach(chip => {
        makeDraggable({
          element: chip,
          payload: chip.dataset.item,
          renderGhostHTML: () => chip.innerHTML,
          onDropCheck: (cx, cy, itemId) => {
            if (isInsideRect(cx, cy, targetSvg, 10)) {
              d.placedItems.push(itemId);
              sfx.playPop();
              showToast('✨ Barang disusun kemas!');
              renderCurrentScreen();
              return true;
            }
            return false;
          }
        });
      });
    } else {
      dockControls.innerHTML = `<button class="action-btn btn-primary" id="d3-s5-next">HASIL AKHIR 🏆</button>`;
      document.getElementById('d3-s5-next').onclick = () => { sfx.playClick(); addStars(2); state.step = 6; renderCurrentScreen(); };
    }
    return;
  }

  // STEP 6: HASIL AKHIR ORGANIZER
  if (s === 6) {
    state.completedDoors[3] = true;
    setProgress(100);
    sfx.playFanfare();
    setMascot('Tahniah! Kotak kadbod terpakai kini menjadi organizer yang membantu meja kamu lebih kemas.');
    setInstruction('Kraf Pintu 3 Selesai! Tekan SETERUSNYA untuk kembali ke 4 pintu.');

    arena.innerHTML = `
      <svg viewBox="0 0 260 265" width="245" height="250" class="pulse-guide">
        ${getSvgDefs()}
        <ellipse cx="130" cy="244" rx="82" ry="13" fill="#b08968" opacity="0.45"/>
        <rect x="46" y="96" width="168" height="32" rx="4" fill="#b08968" stroke="#7f5539" stroke-width="3"/>
        <rect x="54" y="64" width="38" height="68" rx="4" fill="#ffe66d" stroke="#f4a261" stroke-width="2.5"/>
        <g transform="translate(122, 54) rotate(-8)"><rect x="-5" y="12" width="10" height="72" fill="#ff9f1c" stroke="#5c4033" stroke-width="2"/><polygon points="-5,12 5,12 0,0" fill="#ffd6a5"/></g>
        <g transform="translate(182, 62) rotate(10)"><circle cx="-7" cy="0" r="8" fill="none" stroke="#ff595e" stroke-width="3.5"/><circle cx="7" cy="0" r="8" fill="none" stroke="#ff595e" stroke-width="3.5"/><rect x="-4" y="8" width="8" height="58" rx="3" fill="#adb5bd"/></g>
        <path d="M46 122 L214 122 L214 238 Q214 244 206 244 L54 244 Q46 244 46 238 Z" fill="${d.color}" stroke="#7f5539" stroke-width="3.5"/>
        ${d.pattern !== 'none' ? `<path d="M46 122 L214 122 L214 238 Q214 244 206 244 L54 244 Q46 244 46 238 Z" fill="${getPatternOverlay(d.pattern)}"/>` : ''}
        <rect x="98" y="122" width="8" height="120" fill="#9c6644" stroke="#582f0e" stroke-width="2"/>
        <rect x="154" y="122" width="8" height="120" fill="#9c6644" stroke="#582f0e" stroke-width="2"/>
        ${d.stickers.map(st => `<text x="${st.x}" y="${st.y}" font-size="24" text-anchor="middle">${st.emoji}</text>`).join('')}
        <text x="44" y="45" font-size="24">⭐</text>
        <text x="216" y="45" font-size="24">⭐</text>
      </svg>
    `;
    dockControls.innerHTML = `
      <button class="action-btn btn-secondary" id="d3-replay">🔄 MAIN SEMULA</button>
      <button class="action-btn btn-primary" id="d3-done">SETERUSNYA 🏠</button>
    `;
    document.getElementById('d3-replay').onclick = () => { sfx.playClick(); startDoor(3); };
    document.getElementById('d3-done').onclick = () => { sfx.playClick(); goHome(); };
  }
}

/* ==========================================================================
   9. PINTU 4 — KERTAS TERPAKAI MENJADI BUNGA HIASAN (7 LANGKAH)
   ========================================================================== */
function renderDoor4() {
  const s = state.step;
  const d = state.d4;
  setProgress(((s - 1) / 6) * 100);

  // STEP 1: KENALI KERTAS TERPAKAI
  if (s === 1) {
    setMascot('Kertas warna atau kertas majalah terpakai tidak perlu dibuang! Kita boleh gunting dan cantumkannya menjadi bunga hiasan yang cantik.');
    setInstruction('Tekan MULA untuk membuat bunga kertas!');
    arena.innerHTML = `
      <svg viewBox="0 0 260 265" width="245" height="250" class="pulse-guide">
        <ellipse cx="130" cy="244" rx="74" ry="12" fill="#b08968" opacity="0.45"/>
        <rect x="64" y="42" width="132" height="184" rx="10" fill="#fffdf7" stroke="#adb5bd" stroke-width="3.5" transform="rotate(-4 130 134)"/>
        <line x1="86" y1="84" x2="174" y2="78" stroke="#ced4da" stroke-width="4" stroke-linecap="round"/>
        <line x1="86" y1="112" x2="174" y2="106" stroke="#ced4da" stroke-width="4" stroke-linecap="round"/>
        <line x1="86" y1="140" x2="152" y2="136" stroke="#ced4da" stroke-width="4" stroke-linecap="round"/>
        <text x="130" y="185" text-anchor="middle" font-family="Fredoka" font-size="14" font-weight="700" fill="#6c757d">KERTAS TERPAKAI</text>
      </svg>
    `;
    dockControls.innerHTML = `<button class="action-btn btn-primary" id="d4-s1">🚀 MULA KRAF</button>`;
    document.getElementById('d4-s1').onclick = () => { sfx.playClick(); state.step = 2; renderCurrentScreen(); };
    return;
  }

  // STEP 2: PILIH WARNA KERTAS
  if (s === 2) {
    setMascot('Pilih warna kertas kraf yang kamu suka untuk dijadikan kelopak bunga!');
    setInstruction('Ketik warna kertas pilihan kamu di bawah!');
    const colors = [
      { hex: '#ff758f', name: 'Merah Jambu' },
      { hex: '#ffb703', name: 'Kuning Cerah' },
      { hex: '#9d4edd', name: 'Lavender' },
      { hex: '#48cae4', name: 'Biru Langit' },
      { hex: '#ff595e', name: 'Merah Mawar' }
    ];

    arena.innerHTML = `
      <svg viewBox="0 0 260 265" width="245" height="250">
        <ellipse cx="130" cy="244" rx="74" ry="12" fill="#b08968" opacity="0.45"/>
        <rect x="64" y="42" width="132" height="184" rx="12" fill="${d.paperColor}" stroke="#ffffff" stroke-width="4"/>
        <text x="130" y="138" text-anchor="middle" font-family="Fredoka" font-size="16" font-weight="700" fill="#ffffff">KERTAS KRAF</text>
      </svg>
    `;

    dockControls.innerHTML = `
      <div class="palette-row">
        ${colors.map(c => `<button class="swatch-btn ${d.paperColor === c.hex ? 'active' : ''}" style="background:${c.hex}" data-col="${c.hex}" title="${c.name}"></button>`).join('')}
      </div>
      <button class="action-btn btn-primary" style="padding:9px 20px; font-size:14px;" id="d4-s2-next">GUNTING KELOPAK ➜</button>
    `;

    document.querySelectorAll('.swatch-btn').forEach(b => b.onclick = () => { sfx.playClick(); d.paperColor = b.dataset.col; renderCurrentScreen(); });
    document.getElementById('d4-s2-next').onclick = () => { sfx.playClick(); state.step = 3; renderCurrentScreen(); };
    return;
  }

  // STEP 3: MEMBENTUK KELOPAK (GUNTING OUTLINE)
  if (s === 3) {
    const doneCut = d.petalsCut >= 5;
    setMascot(doneCut ? 'Syabas! 5 kelopak bunga kertas telah siap digunting.' : 'Tekan pada lakaran kelopak putus-putus untuk menggunting 5 kelopak bunga!');
    setInstruction(doneCut ? '5 Kelopak terhasil!' : `TEKAN LAKARAN KELOPAK UNTUK GUNTING (${d.petalsCut}/5)`);

    arena.innerHTML = `
      <svg viewBox="0 0 260 265" width="245" height="250">
        <rect x="34" y="28" width="192" height="156" rx="12" fill="${d.paperColor}" stroke="#ffffff" stroke-width="3.5"/>
        ${!doneCut ? `
          <g id="petal-outline-target" style="cursor:pointer;" class="blink-guide">
            <path d="M130 48 C158 48, 172 95, 130 156 C88 95, 102 48, 130 48 Z"
                  fill="rgba(255,255,255,0.28)" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 6"/>
            <text x="130" y="106" text-anchor="middle" font-family="Fredoka" font-size="13" font-weight="700" fill="#ffffff">✂️ GUNTING</text>
          </g>
        ` : `<text x="130" y="110" text-anchor="middle" font-family="Fredoka" font-size="16" font-weight="700" fill="#ffffff">✨ 5 KELOPAK SIAP!</text>`}

        <!-- Tray of cut petals -->
        <g transform="translate(0, 215)">
          ${Array.from({ length: d.petalsCut }).map((_, i) => `
            <path d="M${48 + i * 41} -16 C${58 + i * 41} -16, ${63 + i * 41} 4, ${48 + i * 41} 24 C${33 + i * 41} 4, ${38 + i * 41} -16, ${48 + i * 41} -16 Z"
                  fill="${d.paperColor}" stroke="#ffffff" stroke-width="2.5"/>
          `).join('')}
        </g>
      </svg>
    `;

    if (!doneCut) {
      dockControls.innerHTML = `<div style="font-size:12px; color:#6c757d; font-weight:700;">Ketik lakaran kelopak di atas kertas untuk menggunting</div>`;
      document.getElementById('petal-outline-target').onclick = () => {
        sfx.playSnip();
        d.petalsCut++;
        if (d.petalsCut === 5) {
          addStars(1);
          sfx.playPop();
          showToast('🌸 Semua 5 kelopak terhasil!');
        }
        renderCurrentScreen();
      };
    } else {
      dockControls.innerHTML = `<button class="action-btn btn-primary" id="d4-s3-next">SUSUN KELOPAK ➜</button>`;
      document.getElementById('d4-s3-next').onclick = () => { sfx.playClick(); state.step = 4; renderCurrentScreen(); };
    }
    return;
  }

  // STEP 4: SUSUN KELOPAK (DRAG PETALS TO CENTER BASE)
  if (s === 4) {
    const doneAsm = d.petalsAssembled >= 5;
    setMascot(doneAsm ? 'Cantiknya susunan kelopak bunga kamu!' : 'Seret kelopak kertas satu demi satu ke tapak bunga di tengah!');
    setInstruction(doneAsm ? 'Semua kelopak bercantum!' : `SERET KELOPAK KE TAPAK BUNGA (${d.petalsAssembled}/5)`);

    const angles = [0, 72, 144, 216, 288];
    arena.innerHTML = `
      <svg id="flower-base-target" viewBox="0 0 260 265" width="245" height="250">
        <!-- Guide Ring -->
        <circle cx="130" cy="130" r="56" fill="rgba(255,230,109,0.28)" stroke="#f4a261" stroke-width="3" stroke-dasharray="8 6" class="${!doneAsm ? 'blink-guide' : ''}"/>

        <!-- Assembled Petals -->
        <g transform="translate(130, 130)">
          ${angles.slice(0, d.petalsAssembled).map(ang => `
            <path d="M0 -64 C22 -64, 28 -25, 0 0 C-28 -25, -22 -64, 0 -64 Z"
                  fill="${d.paperColor}" stroke="#ffffff" stroke-width="2.5" transform="rotate(${ang})"/>
          `).join('')}
          <circle cx="0" cy="0" r="16" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
        </g>
      </svg>
    `;

    if (!doneAsm) {
      dockControls.innerHTML = `
        <div class="palette-row">
          ${Array.from({ length: 5 - d.petalsAssembled }).map((_, idx) => `
            <div class="sticker-chip blink-guide" data-petal="${idx}">🌸</div>
          `).join('')}
        </div>
      `;
      const targetSvg = document.getElementById('flower-base-target');
      document.querySelectorAll('[data-petal]').forEach(chip => {
        makeDraggable({
          element: chip,
          payload: 'petal',
          renderGhostHTML: () => `
            <svg width="42" height="54" viewBox="-22 -64 44 64">
              <path d="M0 -64 C22 -64, 28 -25, 0 0 C-28 -25, -22 -64, 0 -64 Z" fill="${d.paperColor}" stroke="#fff" stroke-width="3"/>
            </svg>`,
          onDropCheck: (cx, cy) => {
            if (isInsideRect(cx, cy, targetSvg, 5)) {
              d.petalsAssembled++;
              sfx.playPop();
              renderCurrentScreen();
              return true;
            }
            return false;
          }
        });
      });
    } else {
      dockControls.innerHTML = `<button class="action-btn btn-primary" id="d4-s4-next">CANTUM BUNGA ➜</button>`;
      document.getElementById('d4-s4-next').onclick = () => { sfx.playClick(); addStars(1); state.step = 5; renderCurrentScreen(); };
    }
    return;
  }

  // STEP 5: CANTUM PUTIK TENGAH, BATANG & DAUN
  if (s === 5) {
    const allParts = d.centerPlaced && d.stemPlaced && d.leafPlaced;
    setMascot(allParts ? 'Bunga kertas kamu sudah lengkap dengan putik, batang dan daun!' : 'Seret putik tengah, batang hijau dan daun untuk mencantumkan bunga!');
    setInstruction(allParts ? 'Semua bahagian dicantum!' : 'SERET BAHAGIAN BUNGA KE TAPAK');

    const angles = [0, 72, 144, 216, 288];
    arena.innerHTML = `
      <svg id="flower-parts-target" viewBox="0 0 260 265" width="245" height="250">
        <!-- Stem -->
        ${d.stemPlaced ? `
          <line x1="130" y1="95" x2="130" y2="245" stroke="#2b9348" stroke-width="8" stroke-linecap="round"/>
        ` : `
          <line x1="130" y1="150" x2="130" y2="245" stroke="#95d5b2" stroke-width="6" stroke-dasharray="7 5" class="blink-guide"/>
        `}

        <!-- Leaf -->
        ${d.leafPlaced ? `
          <path d="M130 192 Q168 172 178 194 Q156 212 130 192 Z" fill="#52b788" stroke="#2d6a4f" stroke-width="2.5"/>
          <path d="M130 205 Q92 185 82 207 Q104 225 130 205 Z" fill="#74c69d" stroke="#2d6a4f" stroke-width="2.5"/>
        ` : ''}

        <!-- Petals -->
        <g transform="translate(130, 95)">
          ${angles.map(ang => `
            <path d="M0 -56 C20 -56, 25 -22, 0 0 C-25 -22, -20 -56, 0 -56 Z"
                  fill="${d.paperColor}" stroke="#ffffff" stroke-width="2.5" transform="rotate(${ang})"/>
          `).join('')}
          ${d.centerPlaced ? `
            <circle cx="0" cy="0" r="18" fill="${d.centerColor}" stroke="#f4a261" stroke-width="3"/>
          ` : `
            <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#f4a261" stroke-width="3" stroke-dasharray="5 4" class="blink-guide"/>
          `}
        </g>
      </svg>
    `;

    if (!allParts) {
      const parts = [];
      if (!d.centerPlaced) parts.push({ id: 'center', label: 'Putik', emoji: '🟡' });
      if (!d.stemPlaced) parts.push({ id: 'stem', label: 'Batang', emoji: '🥢' });
      if (!d.leafPlaced) parts.push({ id: 'leaf', label: 'Daun', emoji: '🍃' });

      dockControls.innerHTML = `
        <div class="palette-row">
          ${parts.map(pt => `
            <div class="sticker-chip blink-guide" style="width:78px; height:52px; flex-direction:column; font-size:20px;" data-part="${pt.id}">
              <span>${pt.emoji}</span>
              <span style="font-size:10px; font-weight:700;">${pt.label}</span>
            </div>
          `).join('')}
        </div>
      `;

      const targetSvg = document.getElementById('flower-parts-target');
      document.querySelectorAll('[data-part]').forEach(chip => {
        makeDraggable({
          element: chip,
          payload: chip.dataset.part,
          renderGhostHTML: () => chip.innerHTML,
          onDropCheck: (cx, cy, pid) => {
            if (isInsideRect(cx, cy, targetSvg, 10)) {
              if (pid === 'center') d.centerPlaced = true;
              if (pid === 'stem') d.stemPlaced = true;
              if (pid === 'leaf') d.leafPlaced = true;
              sfx.playPop();
              renderCurrentScreen();
              return true;
            }
            return false;
          }
        });
      });
    } else {
      dockControls.innerHTML = `<button class="action-btn btn-primary" id="d4-s5-next">HIAS BUNGA ➜</button>`;
      document.getElementById('d4-s5-next').onclick = () => { sfx.playClick(); addStars(1); state.step = 6; renderCurrentScreen(); };
    }
    return;
  }

  // STEP 6: HIAS BUNGA KERTAS
  if (s === 6) {
    setMascot('Tambahkan sentuhan terakhir dengan memilih warna putik dan menyeret hiasan comel ke bunga kamu!');
    setInstruction('Pilih warna putik atau SERET hiasan ke bunga!');
    const centerCols = ['#ffe66d', '#ff9f1c', '#ffffff', '#cdb4db', '#90e0ef'];
    const decoStickers = ['🦋', '✨', '🐞', '🎀', '💖'];
    const angles = [0, 72, 144, 216, 288];

    arena.innerHTML = `
      <svg id="flower-deco-target" viewBox="0 0 260 265" width="245" height="250">
        <line x1="130" y1="95" x2="130" y2="245" stroke="#2b9348" stroke-width="8" stroke-linecap="round"/>
        <path d="M130 192 Q168 172 178 194 Q156 212 130 192 Z" fill="#52b788" stroke="#2d6a4f" stroke-width="2.5"/>
        <path d="M130 205 Q92 185 82 207 Q104 225 130 205 Z" fill="#74c69d" stroke="#2d6a4f" stroke-width="2.5"/>
        <g transform="translate(130, 95)">
          ${angles.map(ang => `
            <path d="M0 -56 C20 -56, 25 -22, 0 0 C-25 -22, -20 -56, 0 -56 Z"
                  fill="${d.paperColor}" stroke="#ffffff" stroke-width="2.5" transform="rotate(${ang})"/>
          `).join('')}
          <circle cx="0" cy="0" r="18" fill="${d.centerColor}" stroke="#f4a261" stroke-width="3"/>
        </g>
        ${d.stickers.map(st => `<text x="${st.x}" y="${st.y}" font-size="24" text-anchor="middle" dominant-baseline="central">${st.emoji}</text>`).join('')}
      </svg>
    `;

    dockControls.innerHTML = `
      <div class="palette-row">
        ${centerCols.map(c => `<button class="swatch-btn ${d.centerColor === c ? 'active' : ''}" style="background:${c}" data-col="${c}"></button>`).join('')}
      </div>
      <div class="palette-row">
        ${decoStickers.map(st => `<div class="sticker-chip" data-emoji="${st}">${st}</div>`).join('')}
        <button class="action-btn btn-primary" style="padding:7px 14px; font-size:13px;" id="d4-s6-next">HASIL AKHIR 🏆</button>
      </div>
    `;

    document.querySelectorAll('.swatch-btn').forEach(b => b.onclick = () => { sfx.playClick(); d.centerColor = b.dataset.col; renderCurrentScreen(); });

    const targetSvg = document.getElementById('flower-deco-target');
    document.querySelectorAll('.sticker-chip').forEach(chip => {
      makeDraggable({
        element: chip,
        payload: chip.dataset.emoji,
        renderGhostHTML: (em) => `<div style="font-size:34px;">${em}</div>`,
        onDropCheck: (cx, cy, em) => {
          if (isInsideRect(cx, cy, targetSvg, -5)) {
            const r = targetSvg.getBoundingClientRect();
            const svgX = Math.max(65, Math.min(195, ((cx - r.left) / r.width) * 260));
            const svgY = Math.max(40, Math.min(220, ((cy - r.top) / r.height) * 260));
            d.stickers.push({ emoji: em, x: svgX, y: svgY });
            sfx.playPop();
            renderCurrentScreen();
            return true;
          }
          return false;
        }
      });
    });

    document.getElementById('d4-s6-next').onclick = () => { sfx.playClick(); addStars(2); state.step = 7; renderCurrentScreen(); };
    return;
  }

  // STEP 7: HASIL AKHIR BUNGA KERTAS
  if (s === 7) {
    state.completedDoors[4] = true;
    setProgress(100);
    sfx.playFanfare();
    setMascot('Cantik! Kertas terpakai berjaya dijadikan bunga hiasan yang kreatif.');
    setInstruction('Kraf Pintu 4 Selesai! Tekan SETERUSNYA untuk kembali ke 4 pintu.');

    const angles = [0, 72, 144, 216, 288];
    arena.innerHTML = `
      <svg viewBox="0 0 260 265" width="245" height="250" class="sway-plant">
        <line x1="130" y1="95" x2="130" y2="245" stroke="#2b9348" stroke-width="8" stroke-linecap="round"/>
        <path d="M130 192 Q168 172 178 194 Q156 212 130 192 Z" fill="#52b788" stroke="#2d6a4f" stroke-width="2.5"/>
        <path d="M130 205 Q92 185 82 207 Q104 225 130 205 Z" fill="#74c69d" stroke="#2d6a4f" stroke-width="2.5"/>
        <g transform="translate(130, 95)">
          ${angles.map(ang => `
            <path d="M0 -56 C20 -56, 25 -22, 0 0 C-25 -22, -20 -56, 0 -56 Z"
                  fill="${d.paperColor}" stroke="#ffffff" stroke-width="2.5" transform="rotate(${ang})"/>
          `).join('')}
          <circle cx="0" cy="0" r="18" fill="${d.centerColor}" stroke="#f4a261" stroke-width="3"/>
        </g>
        ${d.stickers.map(st => `<text x="${st.x}" y="${st.y}" font-size="24" text-anchor="middle">${st.emoji}</text>`).join('')}
        <text x="46" y="45" font-size="24">⭐</text>
        <text x="214" y="45" font-size="24">⭐</text>
      </svg>
    `;
    dockControls.innerHTML = `
      <button class="action-btn btn-secondary" id="d4-replay">🔄 MAIN SEMULA</button>
      <button class="action-btn btn-primary" id="d4-done">SETERUSNYA 🏠</button>
    `;
    document.getElementById('d4-replay').onclick = () => { sfx.playClick(); startDoor(4); };
    document.getElementById('d4-done').onclick = () => { sfx.playClick(); goHome(); };
  }
}

/* ==========================================================================
   10. BOOTSTRAP APPLICATION ON LOAD
   ========================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  // Start BGM gently upon first user pointer interaction (browser autoplay policy)
  document.body.addEventListener('pointerdown', () => sfx.init(), { once: true });
  goHome();
});
</script>
</body>
